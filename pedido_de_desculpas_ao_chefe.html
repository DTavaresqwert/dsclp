<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desculpa Chefe!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.8); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Animação e estilo para o botão fugitivo */
        #btnNo {
            transition: left 0.2s ease-out, top 0.2s ease-out;
            position: absolute;
            z-index: 50;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 overflow-x-hidden relative">

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-md rounded-3xl p-8 border border-slate-700/50 shadow-2xl text-center relative z-10 transition-all duration-500 my-auto">
        
        <!-- Ícone do topo -->
        <div class="mb-6 inline-flex items-center justify-center w-20 h-20 rounded-full bg-amber-500/10 text-amber-400 text-4xl shadow-inner border border-amber-500/20">
            🙏
        </div>

        <!-- Título principal -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight mb-3">
            Desculpa chefe!
        </h1>
        
        <p id="subheading" class="text-slate-400 text-sm md:text-base mb-8">
            Processando pedido de perdão...
        </p>

        <!-- Container da Contagem Regressiva -->
        <div id="timerContainer" class="my-6">
            <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border-4 border-slate-700/60"></div>
                <div class="absolute inset-0 rounded-full border-4 border-amber-500 border-t-transparent animate-spin"></div>
                <span id="countdownNumber" class="text-5xl font-black text-amber-400 font-mono">10</span>
            </div>
            <p class="text-slate-400 text-xs mt-4 uppercase tracking-widest font-semibold">segundos para a decisão</p>
        </div>

        <!-- Pergunta e Botões -->
        <div id="questionContainer" class="hidden fade-in">
            <h2 class="text-2xl font-bold text-white mb-8">
                Estou desculpado?
            </h2>

            <div id="buttonsWrapper" class="relative w-full h-28 flex items-center justify-center gap-4">
                <!-- Botão SIM -->
                <button id="btnYes" class="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-slate-950 font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-emerald-500/25 transition-all text-lg cursor-pointer flex items-center justify-center gap-2">
                    <span>Sim</span>
                    <span class="text-xl">✨</span>
                </button>

                <!-- Botão NÃO (Fugitivo) -->
                <button id="btnNo" class="bg-rose-500/80 hover:bg-rose-500 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg shadow-rose-500/20 text-lg cursor-pointer whitespace-nowrap">
                    Não 😅
                </button>
            </div>
        </div>

        <!-- Mensagem de Sucesso (Limpa e sem frases extras/promessas) -->
        <div id="successMessage" class="hidden bounce-in py-6">
            <div class="text-6xl mb-4 animate-bounce">🎉</div>
            <h2 class="text-3xl font-black text-emerald-400">
                Muito obrigado! 🙌
            </h2>
        </div>

    </div>

    <script>
        const countdownNumber = document.getElementById('countdownNumber');
        const timerContainer = document.getElementById('timerContainer');
        const questionContainer = document.getElementById('questionContainer');
        const successMessage = document.getElementById('successMessage');
        const subheading = document.getElementById('subheading');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const buttonsWrapper = document.getElementById('buttonsWrapper');

        let seconds = 10;
        let countdownInterval;

        // Inicia a contagem de 10 segundos
        window.addEventListener('load', () => {
            countdownInterval = setInterval(() => {
                seconds--;
                countdownNumber.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(countdownInterval);
                    showQuestionPhase();
                }
            }, 1000);
        });

        function showQuestionPhase() {
            timerContainer.classList.add('hidden');
            subheading.textContent = 'Por favor, escolha com sabedoria! 😊';
            questionContainer.classList.remove('hidden');

            positionNoButtonInitial();
        }

        // Posiciona o botão Não ao lado do Sim
        function positionNoButtonInitial() {
            const wrapperRect = buttonsWrapper.getBoundingClientRect();
            const btnYesRect = btnYes.getBoundingClientRect();
            
            const leftOffset = (btnYesRect.right - wrapperRect.left) + 16;
            const topOffset = (btnYesRect.top - wrapperRect.top);

            btnNo.style.left = `${leftOffset}px`;
            btnNo.style.top = `${topOffset}px`;
        }

        // Faz o botão "Não" fugir pelo ecra
        function moveNoButton() {
            const padding = 20;
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;

            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            if (btnNo.parentElement !== document.body) {
                document.body.appendChild(btnNo);
                btnNo.style.position = 'fixed';
            }

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnNo.style.left = `${randomX}px`;
            btnNo.style.top = `${randomY}px`;
        }

        btnNo.addEventListener('mouseover', moveNoButton);
        btnNo.addEventListener('click', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // Evento do botão SIM
        btnYes.addEventListener('click', () => {
            questionContainer.classList.add('hidden');
            if (btnNo.parentElement === document.body) {
                btnNo.remove();
            }
            
            subheading.classList.add('hidden');
            successMessage.classList.remove('hidden');

            triggerConfetti();
        });

        // Efeito de confete ao festejar
        function triggerConfetti() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });

            const duration = 3 * 1000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }
    </script>
</body>
</html>
